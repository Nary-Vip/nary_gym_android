<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nary Gym - Get Fit, Stay Healthy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #f59e0b;
            --text: #ffffff;
            --bg: #0f172a;
            --card-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 40px 0;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            color: var(--accent);
            text-transform: uppercase;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .hero-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            background-color: var(--primary);
            color: white;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(30, 58, 138, 0.5);
            background-color: #1e40af;
        }

        .download-btn svg {
            margin-right: 12px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 40px;
        }

        .feature-item {
            text-align: center;
        }

        .feature-title {
            display: block;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 0.875rem;
            color: #64748b;
        }

        footer {
            padding: 40px 0;
            text-align: center;
            font-size: 0.875rem;
            color: #475569;
        }

        @media (max-width: 640px) {
            .hero-card {
                padding: 32px 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .logo {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">NARY GYM</div>
        </header>

        <main>
            <div class="hero-card">
                <h1>Ready to Transform?</h1>
                <p>Track your workouts, set reminders, and achieve your fitness goals with Nary Gym app.</p>

                <a href="https://drive.google.com/drive/folders/1zHK7VxA9AayKiLfz3I2VsNyjMqgJkAk5?usp=sharing" class="download-btn" target="_blank">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download APK
                </a>

                <div class="features">
                    <div class="feature-item">
                        <span class="feature-title">Reminders</span>
                        <span class="feature-desc">Never miss a session</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-title">Tracking</span>
                        <span class="feature-desc">Logged progress</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-title">Clean UI</span>
                        <span class="feature-desc">Modern experience</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Nary Gym. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
